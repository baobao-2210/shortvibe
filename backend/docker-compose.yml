version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shortvibe-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortvibe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortvibe_password}
      POSTGRES_DB: ${POSTGRES_DB:-shortvibe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortvibe_user -d shortvibe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shortvibe-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shortvibe.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
